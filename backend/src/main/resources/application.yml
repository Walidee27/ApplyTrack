server:
  port: ${PORT:8080} # Render impose le port via la variable PORT

spring:
  application:
    name: applytrack
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/applytrack}
    username: ${DATABASE_USER:applytrack}
    password: ${DATABASE_PASSWORD:applytrack}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5} # les offres gratuites limitent le nombre de connexions
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # le schéma est géré uniquement par Flyway
  # En local, Mailpit (docker compose) capture les e-mails : http://localhost:8025
  # En production, n'importe quel SMTP (Brevo, Resend, Mailjet…)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

app:
  jwt:
    # Au moins 32 caractères (HMAC-SHA256). À surcharger en production avec JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
    expiration: ${JWT_EXPIRATION:PT24H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  reminders:
    enabled: ${REMINDERS_ENABLED:true}
    cron: ${REMINDERS_CRON:0 0 8 * * *} # tous les jours à 8 h (Europe/Paris)
    mail-from: ${MAIL_FROM:ApplyTrack <no-reply@applytrack.dev>}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
  demo:
    # Compte public demo@example.com / demo12345, recréé au démarrage et chaque nuit à 4 h
    enabled: ${DEMO_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false # un SMTP indisponible ne doit pas rendre l'API « DOWN »
