# Environnement local : `docker compose up -d db mailpit` pour la base et le serveur mail seuls,
# ou `docker compose up --build` pour tout lancer, API comprise.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: applytrack
      POSTGRES_USER: applytrack
      POSTGRES_PASSWORD: applytrack
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applytrack -d applytrack"]
      interval: 5s
      retries: 10

  # Faux serveur SMTP : capture les e-mails envoyés et les affiche sur http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/applytrack
      DATABASE_USER: applytrack
      DATABASE_PASSWORD: applytrack
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  db-data:
