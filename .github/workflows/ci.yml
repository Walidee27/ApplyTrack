name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Back-end (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # "verify" lance les tests unitaires puis les tests d'intégration Testcontainers (Docker est dispo sur les runners)
      - run: mvn -B verify
      - name: Construction de l'image Docker
        run: docker build -t applytrack-api .

  frontend:
    name: Front-end (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
